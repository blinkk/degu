name: 'Deploy to GitHub Pages'

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build library and docs
        run: |
          npm run build
          npm run doc
      - name: Build coverage
        run: |
          npm run coverage
          mv ./coverage ./docs/coverage
      - name: Build examples
        run: |
          npm run examples
          mv ./examples/dist ./docs/examples
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs

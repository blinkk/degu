name: 'Release Please'

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish current package version to npm via OIDC Trusted Publishing'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish) }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
        if: ${{ steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      - name: Install, build, and test
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm run lint
          npm test
        if: ${{ steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      - name: Publish to npm
        run: npm publish --provenance --access public
        if: ${{ steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
